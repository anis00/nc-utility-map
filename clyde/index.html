<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clyde, NC utility map</title>
<meta name="description" content="Clyde, NC: water, sewer, electric and broadband utilities, with address search. Every feature lists its source.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2430; --muted:#5d6876; --line:#d9dee4; --panel:#f6f7f8; --white:#fff;
  /* APWA uniform color code for utility locating */
  --water:#1565c0; --sewer:#2e7d32; --electric:#c62828; --comms:#ef6c00; --survey:#d81b60;
  --base:#6b7280;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:15px}
#app{display:flex;height:100%}
#panel{width:360px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#map{flex:1;min-width:0}
header{padding:18px 20px 12px;border-bottom:1px solid var(--line);background:var(--white)}
header h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.scroll{overflow-y:auto;flex:1;padding:14px 20px 24px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:11px 12px;border:1.5px solid var(--ink);border-radius:6px;font:inherit;background:var(--white)}
.search input:focus{outline:3px solid color-mix(in srgb,var(--survey) 35%,transparent);outline-offset:1px}
#results{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:0;list-style:none;background:var(--white);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(27,36,48,.12);z-index:1000;max-height:300px;overflow-y:auto}
#results li{padding:9px 12px;cursor:pointer;font-size:.9rem}
#results li[aria-selected=true],#results li:hover{background:#eef1f4}
#results:empty{display:none}
#summary{display:none;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--survey);border-radius:6px;padding:12px 14px;margin-bottom:16px}
#summary h2{margin:0 0 8px;font-size:1rem}
#summary dl{margin:0;display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:.88rem}
#summary dt{font-weight:600}
#summary dd{margin:0}
#summary .note{margin:10px 0 0;color:var(--muted);font-size:.78rem}
.group{margin-top:14px}
.group h3{margin:0 0 6px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.group h3 .bar{width:18px;height:6px;border-radius:3px}
.item{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.9rem}
.item input{margin:0;width:16px;height:16px;accent-color:var(--ink)}
.item label{flex:1;cursor:pointer}
.item .count{color:var(--muted);font-size:.8rem}
.item.na{color:var(--muted)}
.item.na label{cursor:default}
.sw{width:22px;height:12px;flex:none;display:inline-block}
.sw.line{height:0;border-top:3px solid}
.sw.dash{height:0;border-top:3px dashed}
.sw.point{width:12px;height:12px;border-radius:50%;margin:0 5px}
.sw.fill{border:1.5px solid;border-radius:2px}
footer{padding:12px 20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);background:var(--white)}
footer a{color:var(--ink)}
.leaflet-popup-content{font-family:"Public Sans",system-ui,sans-serif;font-size:.85rem;margin:12px 14px;min-width:200px}
.pop h4{margin:0 0 6px;font-size:.95rem}
.pop table{border-collapse:collapse;width:100%}
.pop td{padding:2px 0;vertical-align:top}
.pop td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
.pop .src td{color:var(--muted);font-size:.78rem}
.pop .src td:last-child{color:var(--muted)}
.est{display:inline-block;margin-top:6px;padding:1px 6px;border:1px dashed var(--ink);border-radius:3px;font-size:.75rem}
#toggle{display:none}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #panel{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}
  #panel.collapsed{height:auto}
  #panel.collapsed .scroll,#panel.collapsed footer{display:none}
  #toggle{display:block;position:absolute;right:16px;top:14px;border:1px solid var(--line);background:var(--white);border-radius:6px;padding:6px 10px;font:inherit;font-size:.82rem}
  header{position:relative}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="Map tools">
    <header>
      <h1 id="title">Clyde, NC utility map</h1>
      <p id="subtitle">Water, sewer, electric and broadband</p>
      <button id="toggle" type="button" aria-expanded="true">Hide panel</button>
    </header>
    <div class="scroll">
      <div class="search">
        <input id="q" type="search" placeholder="Search an address" autocomplete="off"
               aria-label="Search an address" role="combobox" aria-expanded="false" aria-controls="results">
        <ul id="results" role="listbox"></ul>
      </div>
      <section id="summary" aria-live="polite"></section>
      <div id="layers"></div>
    </div>
    <footer id="foot"></footer>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   CONFIGURATION – edit this block for each town
   ===================================================================== */
const CONFIG = {
  town: "Clyde, NC",
  center: [35.533, -82.911],
  zoom: 14,
  dataPath: "data/",
  gapNote: "gap_note.pdf",           // link shown in the footer (leave "" to hide)
  preparedBy: "Anis Harmel, GIS consultant",
  searchRadiusFt: 500,               // "nearby" distance for mains and hydrants

  // Address search: file and function that builds the label from its fields
  addressFile: "addresses.geojson",
  addressLabel: p => p.Full_Address || p.St_Address || "",

  // Parcel fields shown in the address summary
  parcelFields: { parno: "Parcel", gisacres: "Acres", ownname: "Owner" },

  groups: [
    { name: "Water", color: "var(--water)", layers: [
      { id: "water_mains",      file: "water_mains.geojson",      name: "Water mains",   kind: "line",  color: "#1565c0", on: true },
      { id: "hydrants",         file: "hydrants.geojson",         name: "Hydrants",      kind: "point", color: "#1565c0", on: true, minZoom: 15 },
      { id: "water_facilities", file: "water_facilities.geojson", name: "Wells, tanks and pump stations", kind: "point", color: "#0d47a1", on: true },
      { id: "water_area_2004",  file: "water_service_area_2004.geojson", name: "Water service area (2004)", kind: "fill", color: "#1565c0", on: false }
    ]},
    { name: "Sewer", color: "var(--sewer)", layers: [
      { id: "sewer_mains",      file: "sewer_mains.geojson",      name: "Sewer mains",   kind: "line",  color: "#2e7d32", on: true },
      { id: "manholes",         file: "manholes.geojson",         name: "Manholes",      kind: "point", color: "#2e7d32", on: false, minZoom: 16 },
      { id: "sewer_facilities", file: "sewer_facilities.geojson", name: "Treatment plant and lift stations", kind: "point", color: "#1b5e20", on: true },
      { id: "sewer_area_2004",  file: "sewer_service_area_2004.geojson", name: "Sewer service area (2004)", kind: "fill", color: "#2e7d32", on: false }
    ]},
    { name: "Electric", color: "var(--electric)", layers: [
      { id: "transmission",     file: "transmission_lines.geojson", name: "Transmission lines", kind: "line", color: "#c62828", on: true },
      { id: "substations",      file: "substations.geojson",      name: "Substations",   kind: "point", color: "#c62828", on: true },
      { id: "electric_providers", file: "electric_providers.geojson", name: "Electric service territories", kind: "fill", color: "#c62828", on: false }
    ]},
    { name: "Broadband", color: "var(--comms)", layers: [
      { id: "broadband",        file: "broadband_blocks.geojson", name: "Best wired or fixed wireless service", kind: "broadband", color: "#ef6c00", on: false }
    ]},
    { name: "Reference", color: "var(--base)", layers: [
      { id: "town_limits",      file: "town_limits.geojson",      name: "Town limits",   kind: "outline", color: "#1b2430", on: true },
      { id: "study_area",       file: "study_area.geojson",       name: "Study area (incl. growth edge)", kind: "outline-dash", color: "#5d6876", on: true },
      { id: "parcels",          file: "parcels.geojson",          name: "Parcels",       kind: "parcel", color: "#8a94a0", on: true, minZoom: 15 }
    ]}
  ]
};

const BROADBAND_COLORS = {
  "Fiber to the Premises": "#e65100",
  "Cable": "#fb8c00",
  "Licensed Fixed Wireless": "#ffb74d",
  "Licensed-by-Rule Fixed Wireless": "#ffcc80",
  "Unlicensed Fixed Wireless": "#ffe0b2",
  "Copper (DSL)": "#fff3e0",
  "No terrestrial service reported": "#b0b7bf",
  "No locations (unpopulated block)": "#e6e9ec"
};
const SOURCE_FIELDS = ["source", "source_date", "capture_method", "confidence"];
const HIDDEN_FIELDS = new Set(["fid", "OBJECTID", "Shape_Length", "Shape_Area", "layer", "path"]);

/* =====================================================================
   Map setup
   ===================================================================== */
document.getElementById("title").textContent = CONFIG.town + " utility map";
document.title = CONFIG.town + " utility map";
const foot = document.getElementById("foot");
foot.innerHTML = `Prepared by ${CONFIG.preparedBy}. Every feature lists its source; dashed features are estimated.` +
  (CONFIG.gapNote ? ` <a href="${CONFIG.gapNote}" target="_blank" rel="noopener">Read the data gaps note</a>.` : "");

const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView(CONFIG.center, CONFIG.zoom);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const grayBase = L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 16, attribution: "Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors" });
const grayLabels = L.tileLayer(ESRI + "Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 16, pane: "shadowPane" });
const lightGray = L.layerGroup([grayBase, grayLabels]).addTo(map);
const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 20, maxNativeZoom: 19, attribution: "&copy; OpenStreetMap contributors" });
const imagery = L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" });
const imageryLabels = L.tileLayer(ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 20, maxNativeZoom: 19, pane: "shadowPane" });
const aerial = L.layerGroup([imagery, imageryLabels]);
L.control.layers({ "Light gray": lightGray, "Streets (OpenStreetMap)": streets, "Aerial imagery": aerial },
  null, { position: "topright" }).addTo(map);
L.control.scale({ imperial: true, metric: false }).addTo(map);

const isEstimated = p => /estimat/i.test(String(p.confidence || "")) || /estimat/i.test(String(p.capture_method || "")) ||
                         p.estimated === true || /^(yes|true|1)$/i.test(String(p.estimated || ""));
const nice = k => k.replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const fmtVal = v => {
  if (typeof v === "number" && !Number.isInteger(v)) return v.toLocaleString("en-US", { maximumFractionDigits: 3 });
  if (typeof v === "number") return String(v);   // integers unchanged (IDs must not get separators)
  return String(v).replace(/;(?=\S)/g, "; ");
};
const esc = v => fmtVal(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function popupHtml(title, p) {
  const rows = Object.entries(p).filter(([k, v]) => !HIDDEN_FIELDS.has(k) && !SOURCE_FIELDS.includes(k) &&
    v !== null && v !== "" && v !== undefined);
  const src = SOURCE_FIELDS.filter(k => p[k]).map(k => `<tr><td>${nice(k)}</td><td>${esc(p[k])}</td></tr>`).join("");
  return `<div class="pop"><h4>${esc(title)}</h4><table>` +
    rows.map(([k, v]) => `<tr><td>${esc(nice(k))}</td><td>${esc(v)}</td></tr>`).join("") +
    `</table>${src ? `<table class="src">${src}</table>` : ""}` +
    (isEstimated(p) ? `<span class="est">Estimated location</span>` : "") + `</div>`;
}

function styleFor(def, p) {
  const dash = isEstimated(p) ? "6 6" : null;
  switch (def.kind) {
    case "line": return { color: def.color, weight: 3, dashArray: dash };
    case "fill": return { color: def.color, weight: 1.5, fillOpacity: 0.08, dashArray: "4 4" };
    case "outline": return { color: def.color, weight: 2.5, fill: false };
    case "outline-dash": return { color: def.color, weight: 1.5, dashArray: "8 6", fill: false };
    case "parcel": return { color: def.color, weight: 0.7, fillOpacity: 0 };
    case "broadband": return { color: "#ffffff", weight: 0.5,
      fillColor: BROADBAND_COLORS[p.best_technology] || "#ddd", fillOpacity: 0.65 };
  }
  return { color: def.color };
}

/* =====================================================================
   Layers
   ===================================================================== */
const DATA = {};        // id -> GeoJSON
const LAYERS = {};      // id -> Leaflet layer
const DEF = {};         // id -> layer definition

const outlineRenderer = L.svg();   // outlines: clickable on the boundary only, not inside
function buildLayer(def, gj) {
  return L.geoJSON(gj, {
    renderer: def.kind.startsWith("outline") ? outlineRenderer : undefined,
    style: f => styleFor(def, f.properties || {}),
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius: def.id.includes("facilit") || def.id === "substations" ? 7 : 5,
      color: "#fff", weight: 1.5, fillColor: def.color, fillOpacity: 1,
      dashArray: isEstimated(f.properties || {}) ? "2 2" : null }),
    onEachFeature: (f, l) => {
      const p = f.properties || {};
      const title = p.name || p.NAME || p.providers || (p.system ? def.name + " – " + p.system : def.name);
      l.bindPopup(() => popupHtml(title, p), { maxWidth: 320 });
    },
    interactive: def.kind !== "parcel"
  });
}

function refreshZoomVisibility() {
  const z = map.getZoom();
  Object.values(DEF).forEach(def => {
    const layer = LAYERS[def.id], box = document.getElementById("chk-" + def.id);
    if (!layer || !box) return;
    const show = box.checked && (!def.minZoom || z >= def.minZoom);
    if (show && !map.hasLayer(layer)) layer.addTo(map);
    if (!show && map.hasLayer(layer)) map.removeLayer(layer);
  });
}
map.on("zoomend", refreshZoomVisibility);

function swatch(def) {
  const s = document.createElement("span");
  const map_ = { line: "line", point: "point", fill: "fill", outline: "line", "outline-dash": "dash", parcel: "fill", broadband: "fill" };
  s.className = "sw " + map_[def.kind];
  if (def.kind === "point") s.style.background = def.color;
  else if (def.kind === "fill" || def.kind === "parcel" || def.kind === "broadband") {
    s.style.borderColor = def.color; s.style.background = def.kind === "broadband" ? "#fb8c00" : "transparent";
  } else s.style.borderTopColor = def.color;
  return s;
}

function buildPanel() {
  const host = document.getElementById("layers");
  CONFIG.groups.forEach(g => {
    const sec = document.createElement("section");
    sec.className = "group";
    sec.innerHTML = `<h3><span class="bar" style="background:${g.color}"></span>${g.name}</h3>`;
    g.layers.forEach(def => {
      DEF[def.id] = def;
      const row = document.createElement("div");
      row.className = "item";
      const box = document.createElement("input");
      box.type = "checkbox"; box.id = "chk-" + def.id; box.checked = !!def.on;
      const lab = document.createElement("label");
      lab.htmlFor = box.id; lab.textContent = def.name;
      const cnt = document.createElement("span");
      cnt.className = "count"; cnt.id = "cnt-" + def.id; cnt.textContent = "loading";
      row.append(box, swatch(def), lab, cnt);
      box.addEventListener("change", refreshZoomVisibility);
      sec.appendChild(row);
    });
    host.appendChild(sec);
  });
}

async function loadAll() {
  const defs = Object.values(DEF);
  await Promise.all(defs.map(async def => {
    const cnt = document.getElementById("cnt-" + def.id);
    try {
      const r = await fetch(CONFIG.dataPath + def.file);
      if (!r.ok) throw new Error(r.status);
      const gj = await r.json();
      DATA[def.id] = gj;
      LAYERS[def.id] = buildLayer(def, gj);
      cnt.textContent = gj.features.length;
      if (def.minZoom) cnt.title = "Visible from zoom " + def.minZoom;
    } catch (e) {
      cnt.textContent = "not available";
      const box = document.getElementById("chk-" + def.id);
      box.checked = false; box.disabled = true;
      box.closest(".item").classList.add("na");
    }
  }));
  // draw order: polygons below lines below points
  ["broadband", "electric_providers", "water_area_2004", "sewer_area_2004", "study_area", "town_limits", "parcels",
   "transmission", "water_mains", "sewer_mains", "manholes", "hydrants", "substations", "water_facilities", "sewer_facilities"]
    .forEach(id => { if (LAYERS[id] && LAYERS[id].bringToFront) LAYERS[id].bringToFront(); });
  refreshZoomVisibility();
  const fit = LAYERS.study_area || LAYERS.town_limits;
  if (fit) map.fitBounds(fit.getBounds(), { padding: [20, 20] });
  refreshZoomVisibility();
}

/* =====================================================================
   Geometry helpers (lat/lng → local feet)
   ===================================================================== */
const FT_PER_M = 3.28084;
function project(lat0) {
  const kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
  return ([lng, lat]) => [lng * kx, lat * ky];
}
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = dx || dy ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy))) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function linesOf(g) {
  if (!g) return [];
  if (g.type === "LineString") return [g.coordinates];
  if (g.type === "MultiLineString") return g.coordinates;
  if (g.type === "Polygon") return g.coordinates;
  if (g.type === "MultiPolygon") return g.coordinates.flat();
  return [];
}
function nearest(id, lat, lng, isPoint) {
  const gj = DATA[id]; if (!gj) return null;
  const pr = project(lat), P = pr([lng, lat]);
  let best = null;
  gj.features.forEach(f => {
    const g = f.geometry; if (!g) return;
    let d = Infinity;
    if (isPoint || g.type === "Point") {
      const pts = g.type === "Point" ? [g.coordinates] : g.type === "MultiPoint" ? g.coordinates : [];
      pts.forEach(c => { const q = pr(c); d = Math.min(d, Math.hypot(P[0] - q[0], P[1] - q[1])); });
    } else {
      linesOf(g).forEach(line => { for (let i = 1; i < line.length; i++) d = Math.min(d, segDist(P, pr(line[i - 1]), pr(line[i]))); });
    }
    if (!best || d < best.d) best = { d, f };
  });
  return best ? { ft: best.d * FT_PER_M, p: best.f.properties || {} } : null;
}
function inRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPoly(pt, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  return polys.some(rings => inRing(pt, rings[0]) && !rings.slice(1).some(h => inRing(pt, h)));
}
function containing(id, lat, lng) {
  const gj = DATA[id]; if (!gj) return [];
  return gj.features.filter(f => f.geometry && inPoly([lng, lat], f.geometry));
}

/* =====================================================================
   Address search and "at this address" summary
   ===================================================================== */
let ADDRESSES = [];
let marker = null, parcelHi = null;

async function loadAddresses() {
  try {
    const r = await fetch(CONFIG.dataPath + CONFIG.addressFile);
    if (!r.ok) throw new Error(r.status);
    const gj = await r.json();
    ADDRESSES = gj.features.filter(f => f.geometry && f.geometry.type === "Point").map(f => {
      const label = CONFIG.addressLabel(f.properties || {}) || "";
      return { label, key: label.toUpperCase(), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
    }).filter(a => a.label);
    document.getElementById("q").placeholder = `Search ${ADDRESSES.length.toLocaleString()} addresses`;
  } catch (e) {
    const q = document.getElementById("q");
    q.placeholder = "Address search unavailable"; q.disabled = true;
  }
}

const q = document.getElementById("q"), list = document.getElementById("results");
let hits = [], active = -1;
function renderHits() {
  list.innerHTML = hits.map((a, i) => `<li role="option" id="opt-${i}" aria-selected="${i === active}">${esc(a.label)}</li>`).join("");
  q.setAttribute("aria-expanded", hits.length > 0);
  q.setAttribute("aria-activedescendant", active >= 0 ? "opt-" + active : "");
}
q.addEventListener("input", () => {
  const terms = q.value.trim().toUpperCase().split(/\s+/).filter(Boolean);
  active = -1;
  hits = terms.length && q.value.trim().length >= 2
    ? ADDRESSES.filter(a => terms.every(t => a.key.includes(t))).slice(0, 8) : [];
  renderHits();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && hits.length) { active = (active + 1) % hits.length; renderHits(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && hits.length) { active = (active - 1 + hits.length) % hits.length; renderHits(); e.preventDefault(); }
  else if (e.key === "Enter" && hits.length) { choose(hits[Math.max(active, 0)]); e.preventDefault(); }
  else if (e.key === "Escape") { hits = []; renderHits(); }
});
list.addEventListener("mousedown", e => {
  const li = e.target.closest("li"); if (!li) return;
  choose(hits[+li.id.split("-")[1]]); e.preventDefault();
});

function fmtFt(ft) { return ft < 1000 ? Math.round(ft / 5) * 5 + " ft" : (ft / 5280).toFixed(2) + " mi"; }
function mainText(n, sizeKeys, extraKey) {
  if (!n) return "Layer not available";
  if (n.ft > CONFIG.searchRadiusFt) return `None mapped within ${CONFIG.searchRadiusFt} ft (nearest ${fmtFt(n.ft)})`;
  const size = sizeKeys.map(k => n.p[k]).find(v => v !== undefined && v !== null && v !== "");
  const bits = [fmtFt(n.ft) + " away"];
  if (extraKey && n.p[extraKey]) bits.push(n.p[extraKey]);
  bits.push(size ? size + " in" : "size unknown");
  if (n.p.system) bits.push(n.p.system);
  if (isEstimated(n.p)) bits.push("estimated");
  return bits.join(", ");
}

function choose(a) {
  hits = []; renderHits(); q.value = a.label;
  if (marker) map.removeLayer(marker);
  if (parcelHi) map.removeLayer(parcelHi);
  marker = L.circleMarker([a.lat, a.lng], { radius: 8, color: "#fff", weight: 2, fillColor: "#d81b60", fillOpacity: 1 }).addTo(map);
  const parcel = containing("parcels", a.lat, a.lng)[0];
  if (parcel) {
    parcelHi = L.geoJSON(parcel, { style: { color: "#d81b60", weight: 3, fillColor: "#d81b60", fillOpacity: 0.08 }, interactive: false }).addTo(map);
    map.fitBounds(parcelHi.getBounds(), { maxZoom: 18, padding: [80, 80] });
  } else map.setView([a.lat, a.lng], 18);
  refreshZoomVisibility();

  const rows = [];
  if (parcel) {
    const pp = parcel.properties || {};
    const ptxt = Object.entries(CONFIG.parcelFields).filter(([k]) => pp[k] !== undefined && pp[k] !== null && pp[k] !== "")
      .map(([k, lab]) => `${lab} ${esc(k === "gisacres" ? Math.round(pp[k] * 100) / 100 : pp[k])}`).join("<br>");
    rows.push(["Parcel", ptxt || "Found"]);
  } else rows.push(["Parcel", "No parcel found at this point"]);
  rows.push(["Water", esc(mainText(nearest("water_mains", a.lat, a.lng), ["diameter_in", "size_in", "DIAMETER"]))]);
  const hyd = nearest("hydrants", a.lat, a.lng, true);
  rows.push(["Hydrant", hyd ? (hyd.ft <= CONFIG.searchRadiusFt ? fmtFt(hyd.ft) + " away" : `None within ${CONFIG.searchRadiusFt} ft`) : "Layer not available"]);
  rows.push(["Sewer", esc(mainText(nearest("sewer_mains", a.lat, a.lng), ["diameter_in", "size_in", "DIAMETER"], "flow_type"))]);
  const wa = containing("water_area_2004", a.lat, a.lng).length, sa = containing("sewer_area_2004", a.lat, a.lng).length;
  if (DATA.water_area_2004 || DATA.sewer_area_2004)
    rows.push(["2004 areas", `Water ${wa ? "inside" : "outside"}, sewer ${sa ? "inside" : "outside"}`]);
  const el = containing("electric_providers", a.lat, a.lng).map(f => f.properties.NAME || f.properties.providers).filter(Boolean);
  rows.push(["Electric", el.length ? esc(el.join("; ")) : (DATA.electric_providers ? "No territory mapped" : "Layer not available")]);
  const bb = containing("broadband", a.lat, a.lng)[0];
  if (bb) {
    const p = bb.properties;
    rows.push(["Broadband", esc([p.best_technology, p.providers, p.max_down_mbps ? `up to ${p.max_down_mbps} Mbps` : ""].filter(Boolean).join(", "))]);
  } else rows.push(["Broadband", DATA.broadband ? "No census block data" : "Layer not available"]);

  const box = document.getElementById("summary");
  box.style.display = "block";
  box.innerHTML = `<h2>${esc(a.label)}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <p class="note">Straight-line distances to mapped features. Confirm service with the utility before relying on it.</p>`;
}

/* mobile panel toggle */
const tgl = document.getElementById("toggle");
tgl.addEventListener("click", () => {
  const p = document.getElementById("panel");
  const collapsed = p.classList.toggle("collapsed");
  tgl.textContent = collapsed ? "Show panel" : "Hide panel";
  tgl.setAttribute("aria-expanded", !collapsed);
  setTimeout(() => map.invalidateSize(), 50);
});

buildPanel();
loadAll();
loadAddresses();
</script>
